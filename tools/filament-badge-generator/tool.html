<style>
  /* Everything is under .fbg, so nothing reaches the rest of Thingport. Colours come from Thingport's theme;
     tool.js sets the variables. */
  .fbg {
    --panel-2: color-mix(in srgb, var(--panel) 90%, var(--text));
    --line: var(--divider);
    container-type: inline-size;
    box-sizing: border-box;
    height: 100%;
    overflow: auto;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 var(--font);
  }
  .fbg *,
  .fbg *::before,
  .fbg *::after {
    box-sizing: border-box;
  }
  /* `:where()` keeps this reset at the specificity of the root class alone, so a button's own rule still decides
     its colour and weight. */
  .fbg :where(button, input, select) {
    font: inherit;
    color: inherit;
  }
  .fbg :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .fbg [hidden] {
    display: none !important;
  }

  .fbg-main {
    display: grid;
    gap: 12px;
    padding: 12px;
    height: 100%;
    align-items: start;
    grid-template-columns: 300px minmax(0, 1fr);
  }
  @container (max-width: 720px) {
    .fbg-main {
      height: auto;
      grid-template-columns: minmax(0, 1fr);
    }
  }

  .fbg-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .fbg-settings {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-height: 100%;
    overflow: auto;
  }
  .fbg-group {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .fbg-label {
    font-size: 11px;
    font-weight: 650;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .fbg-row {
    display: grid;
    grid-template-columns: repeat(var(--n, 2), 1fr);
    gap: 8px;
  }

  .fbg-field {
    position: relative;
  }
  .fbg-field input,
  .fbg-field select {
    width: 100%;
    height: 36px;
    padding: 0 30px 0 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    outline: none;
    transition: border-color 0.15s;
  }
  .fbg-field select {
    padding-right: 10px;
    cursor: pointer;
  }
  .fbg-field input:focus,
  .fbg-field select:focus {
    border-color: var(--accent);
  }
  /* No spinner arrows — the suffix takes that room. */
  .fbg-field input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
  }
  .fbg-field input::-webkit-inner-spin-button,
  .fbg-field input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .fbg-field input[type="color"] {
    padding: 3px;
    cursor: pointer;
  }
  .fbg-suffix {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }
  .fbg-prefix {
    position: absolute;
    left: 8px;
    top: -7px;
    padding: 0 4px;
    background: var(--panel);
    color: var(--muted);
    font-size: 10px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 1;
  }

  .fbg-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .fbg-switch input {
    appearance: none;
    flex: none;
    width: 38px;
    height: 22px;
    border-radius: 11px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    position: relative;
    cursor: pointer;
    transition:
      background-color 0.15s,
      border-color 0.15s;
  }
  .fbg-switch input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s;
  }
  .fbg-switch input:checked {
    background: var(--accent);
    border-color: transparent;
  }
  .fbg-switch input:checked::after {
    transform: translateX(16px);
  }

  .fbg-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    border-top: 1px dashed var(--line);
    padding-top: 12px;
  }
  .fbg-btn {
    height: 38px;
    padding: 0 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    transition:
      border-color 0.15s,
      opacity 0.15s;
  }
  .fbg-btn:hover:not(:disabled) {
    border-color: var(--muted);
  }
  .fbg-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .fbg-btn.fbg-primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  .fbg-btn svg {
    width: 16px;
    height: 16px;
    flex: none;
  }
  .fbg-status {
    font-size: 12px;
    color: var(--muted);
    min-height: 1.1em;
  }

  .fbg-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 320px;
    max-height: 100%;
    overflow: hidden;
  }
  .fbg-canvas {
    flex: 1;
    width: 100%;
    min-height: 260px;
    display: block;
    touch-action: none;
  }
  .fbg-stage.fbg-no-webgl .fbg-canvas {
    display: none;
  }
  .fbg-foot {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
  }
  .fbg-foot b {
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
</style>
<div class="fbg">
  <main class="fbg-main">
    <section class="fbg-panel fbg-settings" data-t-aria="aria.settings" aria-label="Badge settings">
      <div class="fbg-group">
        <div class="fbg-label" data-t="group.text">Text</div>
        <div class="fbg-row">
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="brand.label">Brand</span>
            <input
              class="fbg-brand"
              type="text"
              maxlength="40"
              aria-label="Brand"
              data-t-placeholder="brand.ph"
              placeholder="Bambu"
            />
          </div>
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="type.label">Type</span>
            <input
              class="fbg-type"
              type="text"
              maxlength="40"
              aria-label="Type"
              data-t-placeholder="type.ph"
              placeholder="Matte"
            />
          </div>
        </div>
        <div class="fbg-row">
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="material.label">Material</span>
            <input
              class="fbg-material"
              type="text"
              maxlength="24"
              aria-label="Material"
              data-t-placeholder="material.ph"
              placeholder="PLA"
            />
          </div>
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="color.label">Colour</span>
            <input
              class="fbg-color"
              type="text"
              maxlength="24"
              aria-label="Colour"
              data-t-placeholder="color.ph"
              placeholder="black"
            />
          </div>
        </div>
      </div>

      <div class="fbg-group">
        <div class="fbg-label" data-t="group.size">Size &amp; print</div>
        <div class="fbg-row" style="--n: 3">
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="width.label">Width</span>
            <input class="fbg-width" type="number" min="24" max="160" step="1" value="56" aria-label="Badge width" />
            <span class="fbg-suffix">mm</span>
          </div>
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="textSize.label">Text</span>
            <input class="fbg-textsize" type="number" min="2" max="16" step="0.5" value="6" aria-label="Text size" />
            <span class="fbg-suffix">mm</span>
          </div>
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="temperature.label">Temp</span>
            <input class="fbg-temp" type="number" min="150" max="350" step="5" value="230" aria-label="Temperature" />
            <span class="fbg-suffix">°C</span>
          </div>
        </div>
      </div>

      <div class="fbg-group">
        <div class="fbg-label" data-t="font.label">Font</div>
        <div class="fbg-field">
          <select class="fbg-font" aria-label="Font"></select>
        </div>
      </div>

      <div class="fbg-group">
        <div class="fbg-label" data-t="group.appearance">Appearance</div>
        <div class="fbg-row">
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="plateColour">Plate</span>
            <input class="fbg-plate-colour" type="color" value="#2E3440" aria-label="Plate colour" />
          </div>
          <div class="fbg-field">
            <span class="fbg-prefix" data-t="textColour">Rim &amp; text</span>
            <input class="fbg-text-colour" type="color" value="#E5E9F0" aria-label="Rim and text colour" />
          </div>
        </div>
        <label class="fbg-switch">
          <span data-t="steps.label">Thickness steps</span>
          <input class="fbg-steps" type="checkbox" checked />
        </label>
      </div>

      <div class="fbg-actions">
        <button type="button" class="fbg-btn fbg-download" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
          </svg>
          <span data-t="downloadBtn">Download</span>
        </button>
        <button type="button" class="fbg-btn fbg-primary fbg-save" disabled>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 3 20 7.5v9L12 21l-8-4.5v-9z" />
            <path d="M12 12l8-4.5M12 12v9M12 12 4 7.5" />
          </svg>
          <span data-t="saveBtn">Save</span>
        </button>
      </div>
      <output class="fbg-status" aria-live="polite"></output>
    </section>

    <section class="fbg-panel fbg-stage" data-t-aria="aria.preview" aria-label="Badge preview">
      <canvas
        class="fbg-canvas"
        tabindex="0"
        data-t-aria="aria.canvas"
        aria-label="The badge in 3D. Drag to turn it, scroll to zoom."
      ></canvas>
      <div class="fbg-foot">
        <b class="fbg-size"></b>
        <span class="fbg-hint" data-t="hint">Drag to turn · scroll to zoom</span>
      </div>
    </section>
  </main>
</div>
